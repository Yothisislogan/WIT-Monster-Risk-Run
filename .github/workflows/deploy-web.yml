# Builds the Godot web export and publishes it to GitHub Pages.
#
# No manual setup needed: the deploy job enables Pages via the API on
# first run (actions/configure-pages with enablement). Deploys on every
# push to main; can also be run manually from the Actions tab.
#
# Thread support is disabled in the Web export preset so the build runs
# on GitHub Pages without cross-origin isolation headers (which Pages
# cannot serve).

name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  # Runs on the plain runner: the godot-ci image has no Python.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static checks
        run: |
          python3 tools/check_references.py
          python3 tools/check_godot_api.py
          python3 tools/check_scenes.py
          python3 tools/check_signals.py
          python3 tools/check_inputs.py
          python3 tools/check_gestures.py
          python3 tools/check_movement.py
          python3 tools/check_aim.py
          python3 tools/check_map.py
          python3 tools/check_sites.py
          python3 tools/check_meta.py
          python3 tools/check_reachability.py
          python3 tools/check_pickups.py
          python3 tools/check_economy.py
          python3 tools/check_text_fit.py

  build:
    needs: checks
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image ships templates under /root, but Actions containers run
      # with a different HOME — move them where Godot will look.
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      # This is the only place in the entire pipeline where a .gd file is ever
      # parsed — there is no Godot binary in the dev environment, and the
      # Python checkers read the source as text. The `|| true` here used to
      # swallow the result, so a parse error, which stops the game loading at
      # all, produced a green build. The exit code is still ignored (a first
      # import legitimately reports missing .import files) but the log is not.
      - name: Import assets, and fail if any script does not parse
        run: |
          godot --headless --import 2>&1 | tee import.log || true
          if grep -nE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|Identifier .* not declared" import.log; then
            echo "::error::a GDScript file failed to parse - see the lines above"
            exit 1
          fi
          echo "all scripts parsed"

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Verify export contains assets
        run: |
          ls -la build/web
          pck=$(du -cb build/web/*.pck 2>/dev/null | tail -1 | cut -f1 || echo 0)
          echo "packed data: ${pck} bytes"
          # the chiptune alone is ~2.8 MB, so anything under 2 MB means the
          # audio (or more) failed to import and silently dropped out
          if [ "${pck}" -lt 2000000 ]; then
            echo "::error::export looks incomplete - assets missing from .pck"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
