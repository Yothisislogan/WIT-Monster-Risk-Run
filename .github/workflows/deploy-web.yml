# Builds the Godot web export and publishes it to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Deploys on every push to main; can also be run manually from the
# Actions tab once this file is on the default branch.
#
# Thread support is disabled in the Web export preset so the build runs
# on GitHub Pages without cross-origin isolation headers (which Pages
# cannot serve).

name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import assets
        run: godot --headless --import || true

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
